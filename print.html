<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ReadPass Pro — 過去問プリント作成</title>
  <meta name="description" content="ReadPass Pro - 英語資格試験リーディングの過去問プリント作成ツール">
  <link rel="stylesheet" href="print.css?v=20261014-homework-v1">
  <link rel="stylesheet" href="pro-theme.css?v=20261014-orange-v1">
  <link rel="icon" href="favicon.ico?v=20261014-orange-v1" sizes="16x16 32x32 48x48">
  <link rel="icon" type="image/svg+xml" href="assets/icons/readpass-pro.svg?v=20261014-orange-v1">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=20261014-orange-v1">
  <link rel="manifest" href="manifest.webmanifest?v=20261014-orange-v1">
  <meta name="theme-color" content="#202326">
  <meta name="apple-mobile-web-app-title" content="ReadPass Pro">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>

<body data-surface="print">
  <!-- ===== Settings Panel (hidden on print) ===== -->
  <div class="settings-panel" id="settingsPanel">
    <header class="settings-header">
      <a href="top.html" class="back-link">← ReadPass Pro トップへ</a>
      <h1 class="settings-title">🖨️ 過去問プリント作成</h1>
      <p class="settings-subtitle">級・年度・回を選んで、問題PDFと講師用の文法解説プリントを用意</p>
    </header>

    <div class="settings-body">
      <!-- Grade Selection -->
      <div class="setting-group">
        <label class="setting-label">級を選択</label>
        <div class="grade-chips" id="gradeChips"></div>
      </div>

      <!-- Exam Selection -->
      <div class="setting-group">
        <label class="setting-label">年度・回を選択 <span class="hint">（複数選択で「まとめプリント」）</span></label>
        <div class="exam-checkboxes" id="examCheckboxes">
          <p class="placeholder-text">先に級を選択してください</p>
        </div>
      </div>

      <!-- Per selected exam: fixed past-exam PDF, grammar guide PDF (output/pdf/grammar_guides.json)
           and homework print (data/homework/index.json) -->
      <div class="setting-group teacher-materials" id="teacherMaterials" hidden>
        <label class="setting-label">過去問・講師用資料・宿題プリント</label>
        <div class="teacher-material-list" id="teacherMaterialList"></div>
      </div>

      <div class="fixed-exam-notice" id="fixedExamNotice" hidden></div>

      <!-- Section Selection -->
      <div class="setting-group">
        <label class="setting-label">大問を選択</label>
        <div class="part-checkboxes" id="sectionCheckboxes">
          <label class="checkbox-label"><input type="checkbox" value="vocabulary" checked> 大問1（語彙・文法）</label>
          <label class="checkbox-label"><input type="checkbox" value="passage-fill" checked> 大問2（空所補充）</label>
          <label class="checkbox-label"><input type="checkbox" value="sentence-order" checked> 大問3（並べ替え）</label>
          <label class="checkbox-label"><input type="checkbox" value="reading-comprehension" checked> 大問3/4（長文読解）</label>
        </div>
      </div>

      <!-- Options -->
      <div class="setting-group">
        <label class="setting-label">オプション</label>
        <div class="option-toggles">
          <label class="toggle-label">
            <input type="checkbox" id="optChoices" checked>
            <span class="toggle-text">選択肢を印刷する</span>
          </label>
          <label class="toggle-label">
            <input type="checkbox" id="optPassage" checked>
            <span class="toggle-text">長文パッセージを印刷する</span>
          </label>
          <label class="toggle-label">
            <input type="checkbox" id="optQR" checked>
            <span class="toggle-text">QRコード付き（アプリへの直リンク）</span>
          </label>
        </div>
      </div>

      <!-- Buttons -->
      <div class="action-buttons">
        <button class="btn btn-primary" id="generateBtn" disabled>プリントを生成</button>
        <button class="btn btn-accent" id="printBtn" style="display:none">🖨️ 印刷する</button>
      </div>
    </div>
  </div>

  <!-- ===== Print Preview ===== -->
  <div id="printPreview" class="print-preview" style="display:none">
    <div class="preview-label" id="previewLabel">プレビュー</div>
    <div id="printContent"></div>
  </div>

  <!-- ===== Homework dialog: next lesson date and session for the flash-card QR ===== -->
  <dialog class="hw-dialog" id="homeworkDialog" aria-labelledby="hwDialogTitle">
    <form id="homeworkForm" method="dialog">
      <h2 class="hw-dialog-title" id="hwDialogTitle">宿題プリントを作成</h2>
      <p class="hw-dialog-target">対象：<strong id="hwTarget"></strong></p>
      <p class="hw-dialog-help">解説の最後（4ページ目）に、次回の授業日と、次回扱う回の単語フラッシュカードのQRコードを入れます。</p>
      <label class="hw-field">
        <span>次回の授業日</span>
        <input type="date" id="hwNextDate" required>
      </label>
      <fieldset class="hw-fieldset" id="hwGradeField">
        <legend>次回の級</legend>
        <div class="hw-radio-grid" id="hwGradeOptions"></div>
      </fieldset>
      <fieldset class="hw-fieldset" id="hwExamField">
        <legend>次回の回（実装済みの回・新しい順）</legend>
        <div class="hw-radio-grid hw-exam-grid" id="hwExamOptions"></div>
      </fieldset>
      <label class="hw-check"><input type="checkbox" id="hwNoNext"> 次回の案内とQRコードを入れない</label>
      <div class="hw-dialog-actions">
        <button type="button" class="btn hw-cancel" id="hwCancel">キャンセル</button>
        <button type="submit" class="btn btn-primary" id="hwCreate">作成する</button>
      </div>
    </form>
  </dialog>

  <script src="print.js?v=20261014-sat-2025-2-v1"></script>
  <script src="pro-pdf-actions.js?v=20261014-orange-v1"></script>
</body>

</html>
